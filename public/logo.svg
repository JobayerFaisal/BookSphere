<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2218"/>
      <stop offset="100%" stop-color="#16120e"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="0" y1="0" x2="256" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5ece0"/>
      <stop offset="100%" stop-color="#ead9bf"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="256" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbf4e9"/>
      <stop offset="100%" stop-color="#ead9bf"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Orbit ring around everything -->
  <ellipse cx="256" cy="256" rx="190" ry="78" fill="none" stroke="#c0392b" stroke-width="9" opacity="0.9" transform="rotate(-12 256 256)"/>
  <circle cx="76" cy="222" r="11" fill="#d4a017" transform="rotate(-12 256 256)"/>

  <!-- Open book -->
  <g transform="translate(256,272)">
    <!-- Left page -->
    <path d="M 0,-18 C -85,-52 -148,-40 -182,-16 L -182,128 C -148,104 -85,116 0,150 Z"
          fill="url(#pageLeft)" stroke="#c0392b" stroke-width="10" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M 0,-18 C 85,-52 148,-40 182,-16 L 182,128 C 148,104 85,116 0,150 Z"
          fill="url(#pageRight)" stroke="#c0392b" stroke-width="10" stroke-linejoin="round"/>
    <!-- Spine shadow -->
    <path d="M 0,-18 L 0,150" stroke="#8b6f47" stroke-width="8"/>

    <!-- Page lines left -->
    <path d="M -148,14 C -110,2 -62,8 -26,26" stroke="#c9a97a" stroke-width="7" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M -148,46 C -110,34 -62,40 -26,58" stroke="#c9a97a" stroke-width="7" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M -148,78 C -110,66 -62,72 -26,90" stroke="#c9a97a" stroke-width="7" fill="none" opacity="0.7" stroke-linecap="round"/>

    <!-- Page lines right -->
    <path d="M 148,14 C 110,2 62,8 26,26" stroke="#c9a97a" stroke-width="7" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M 148,46 C 110,34 62,40 26,58" stroke="#c9a97a" stroke-width="7" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M 148,78 C 110,66 62,72 26,90" stroke="#c9a97a" stroke-width="7" fill="none" opacity="0.7" stroke-linecap="round"/>
  </g>
</svg>
